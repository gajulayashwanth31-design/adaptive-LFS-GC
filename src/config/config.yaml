filesystem:
  total_segments: 20
  blocks_per_segment: 20
  block_size: 4096

gc:
  free_space_threshold: 0.25
  hard_free_space_threshold: 0.08
  min_sealed_segments: 1

workload:
  window_size: 80
  cooldown_ops: 20

drift:
  threshold: 0.25
  min_window_ops: 25

learning:
  learning_rate: 0.05
  l2_reg: 0.001
  initial_confidence: 0.40

exploration:
  epsilon: 0.12
  decay: 0.995
  min_epsilon: 0.02
  uncertainty_weight: 0.15

utility:
  reclaim_weight: 1.0
  copy_cost_weight: 0.5
  latency_weight: 0.2

safety:
  confidence_threshold: 0.50
  fallback_policy: greedy
